---
name: Self Improvement Dashboard
version: "1.0.0"
slug: evolve_dashboard
description: >-
  Track habits, goals and daily reflection from a dark, focused dashboard
  served straight into the Home Assistant sidebar.
url: https://github.com/andrewants/evolve/tree/main/evolve-dashboard
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-timeline-variant-shimmer
panel_title: Evolve
panel_admin: false
homeassistant_api: true
options:
  log_level: info
  week_starts_on: monday
  day_rollover_hour: 4
  sensors: []
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  week_starts_on: list(monday|sunday)
  day_rollover_hour: int(0,12)
  sensors:
    - entity: str
      label: str?
      icon: str?
