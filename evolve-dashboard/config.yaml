---
name: Momentum
version: "2.1.0"
slug: momentum
description: >-
  Self-improvement dashboard — days-since counters, Mi scale body
  composition, Hevy gym sync, affirmations and habits, with Telegram
  reminders. Multi-user with PIN login.
url: https://github.com/andrewants/evolve/tree/main/evolve-dashboard
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-timeline-variant-shimmer
panel_title: Momentum
panel_admin: false
homeassistant_api: true
# Exposed so a Cloudflare tunnel can reach the app directly. Leave null to
# keep it ingress-only; the app authenticates with PINs either way.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Web UI (only needed for a Cloudflare tunnel / reverse proxy)
options:
  log_level: info
  session_days: 14
  day_rollover_hour: 4
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  session_days: int(1,365)
  day_rollover_hour: int(0,12)
