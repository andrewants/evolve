<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `maximum-scale`/`user-scalable` are what stop iOS zooming the whole
         shell on a double tap or a focused field once it is installed to the
         home screen.

         Deliberately NO `viewport-fit=cover`: with it (plus the translucent
         status bar below) iOS lays the standalone web app out from the very
         top of the screen but still sizes the viewport as screen minus the
         top inset, so everything anchored to the bottom — flow item or fixed
         box alike — floated one status-bar height above the bottom edge, and
         env(safe-area-inset-bottom) came back wrong on top of that. Without
         it iOS insets the web view itself: the viewport ends exactly at the
         home indicator, the insets are all zero, and the bar is flush. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#161826" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Momentum" />
    <!-- `black`, not `black-translucent`: the translucent style is what puts
         the page under the status bar, and iOS mis-sizes the viewport when it
         does. iOS keeps the status bar and the home-indicator strip to itself
         and fills them with the page background, which is already this dark. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Momentum</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23161826'/%3E%3Cpath d='M7 22l5-7 4 4 9-11' fill='none' stroke='%239184d9' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <!-- Relative throughout, so it resolves under both the ingress token
         prefix and a bare tunnel host. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" aria-busy="true"></div>
    <script type="module" src="app.js"></script>
    <noscript>
      <p style="padding: 24px; color: #b2b6ca">Momentum needs JavaScript enabled.</p>
    </noscript>
  </body>
</html>
